name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: Existing version tag to release (for example, v1.3.1)
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: release-${{ inputs.tag || github.ref_name }}
    cancel-in-progress: false

jobs:
    release:
        name: Build and publish release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout release tag
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ inputs.tag || github.ref_name }}

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22.22.3
                  cache: npm

            - name: Verify release tag matches package version
              id: release
              env:
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  set -euo pipefail
                  if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
                    echo "Release ref $RELEASE_TAG is not an existing Git tag." >&2
                    exit 1
                  fi

                  VERSION="$(node -p "require('./package.json').version")"
                  EXPECTED_TAG="v${VERSION}"

                  if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
                    echo "Expected tag $EXPECTED_TAG for package version $VERSION, got $RELEASE_TAG." >&2
                    exit 1
                  fi

                  echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
                  echo "asset_name=remnawave-mcp-${RELEASE_TAG}.zip" >> "$GITHUB_OUTPUT"

            - name: Refuse to overwrite an existing release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ steps.release.outputs.tag }}
              run: |
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    echo "GitHub release $RELEASE_TAG already exists; refusing to overwrite it." >&2
                    exit 1
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Validate, test, and build
              run: npm run check

            - name: Create release archive
              env:
                  ASSET_NAME: ${{ steps.release.outputs.asset_name }}
              run: |
                  set -euo pipefail
                  test -d dist
                  zip -qr "$ASSET_NAME" dist

            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ steps.release.outputs.tag }}
                  ASSET_NAME: ${{ steps.release.outputs.asset_name }}
              run: |
                  gh release create "$RELEASE_TAG" "$ASSET_NAME#$ASSET_NAME" \
                    --title "$RELEASE_TAG" \
                    --generate-notes
