services:
    remnawave-mcp:
        build: .
        ports:
            - '127.0.0.1:${MCP_HTTP_PORT:-3100}:3100'
        environment:
            - REMNAWAVE_BASE_URL=${REMNAWAVE_BASE_URL}
            - REMNAWAVE_API_TOKEN=${REMNAWAVE_API_TOKEN}
            - REMNAWAVE_RELEASE=${REMNAWAVE_RELEASE:-v3}
            - REMNAWAVE_REQUEST_TIMEOUT_MS=${REMNAWAVE_REQUEST_TIMEOUT_MS:-30000}
            - REMNAWAVE_API_KEY=${REMNAWAVE_API_KEY:-}
            - REMNAWAVE_READONLY=${REMNAWAVE_READONLY:-false}
            - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:-}
            - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET:-}
            - MCP_HTTP_ENABLED=true
            - MCP_HTTP_HOST=0.0.0.0
            - MCP_HTTP_PORT=3100
            - MCP_HTTP_AUTH_TOKEN=${MCP_HTTP_AUTH_TOKEN:-}
            - MCP_HTTP_MAX_SESSIONS=${MCP_HTTP_MAX_SESSIONS:-100}
            - MCP_HTTP_SESSION_TTL_MS=${MCP_HTTP_SESSION_TTL_MS:-3600000}
            - MCP_HTTP_REQUEST_TIMEOUT_MS=${MCP_HTTP_REQUEST_TIMEOUT_MS:-120000}
            - MCP_HTTP_HEADERS_TIMEOUT_MS=${MCP_HTTP_HEADERS_TIMEOUT_MS:-30000}
            - MCP_HTTP_KEEP_ALIVE_TIMEOUT_MS=${MCP_HTTP_KEEP_ALIVE_TIMEOUT_MS:-5000}
            - MCP_HTTP_MAX_BODY_BYTES=${MCP_HTTP_MAX_BODY_BYTES:-1048576}
            - MCP_HTTP_MAX_HEADER_SIZE_BYTES=${MCP_HTTP_MAX_HEADER_SIZE_BYTES:-16384}
            - MCP_HTTP_READINESS_TIMEOUT_MS=${MCP_HTTP_READINESS_TIMEOUT_MS:-5000}
        restart: unless-stopped
